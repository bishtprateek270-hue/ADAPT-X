<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Strong Core Glow -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arm Gradient -->
    <linearGradient id="carbonArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Propeller Glow Front -->
    <radialGradient id="propGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <!-- Propeller Glow Rear -->
    <radialGradient id="propGlowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.3" filter="url(#cyanGlow)" />

  <!-- Main Background Badge -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGrad)" stroke="#00e5ff" stroke-width="6" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.5" />

  <!-- Radar HUD Elements -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.25" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.2" />
  <circle cx="256" cy="256" r="90" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.2" />
  <line x1="56" y1="256" x2="196" y2="256" stroke="#00f0ff" stroke-width="1.5" opacity="0.3" />
  <line x1="316" y1="256" x2="456" y2="256" stroke="#00f0ff" stroke-width="1.5" opacity="0.3" />
  <line x1="256" y1="56" x2="256" y2="196" stroke="#00f0ff" stroke-width="1.5" opacity="0.3" />
  <line x1="256" y1="316" x2="256" y2="456" stroke="#00f0ff" stroke-width="1.5" opacity="0.3" />

  <!-- Quadcopter Arms -->
  <!-- Top-Right / Front-Right Arm -->
  <line x1="256" y1="256" x2="378" y2="134" stroke="#0f172a" stroke-width="20" stroke-linecap="round" />
  <line x1="256" y1="256" x2="378" y2="134" stroke="url(#carbonArm)" stroke-width="14" stroke-linecap="round" />
  <line x1="256" y1="256" x2="378" y2="134" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Top-Left / Front-Left Arm -->
  <line x1="256" y1="256" x2="134" y2="134" stroke="#0f172a" stroke-width="20" stroke-linecap="round" />
  <line x1="256" y1="256" x2="134" y2="134" stroke="url(#carbonArm)" stroke-width="14" stroke-linecap="round" />
  <line x1="256" y1="256" x2="134" y2="134" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Bottom-Right / Rear-Right Arm -->
  <line x1="256" y1="256" x2="378" y2="378" stroke="#0f172a" stroke-width="20" stroke-linecap="round" />
  <line x1="256" y1="256" x2="378" y2="378" stroke="url(#carbonArm)" stroke-width="14" stroke-linecap="round" />
  <line x1="256" y1="256" x2="378" y2="378" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Bottom-Left / Rear-Left Arm -->
  <line x1="256" y1="256" x2="134" y2="378" stroke="#0f172a" stroke-width="20" stroke-linecap="round" />
  <line x1="256" y1="256" x2="134" y2="378" stroke="url(#carbonArm)" stroke-width="14" stroke-linecap="round" />
  <line x1="256" y1="256" x2="134" y2="378" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Rotor Discs & Blades -->
  <!-- Rotor 1: Front-Left (134, 134) -->
  <g transform="translate(134, 134)">
    <circle cx="0" cy="0" r="66" fill="url(#propGlowCyan)" />
    <circle cx="0" cy="0" r="66" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.8" stroke-dasharray="14,10" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.4" />
    <line x1="-54" y1="-26" x2="54" y2="26" stroke="#f1f5f9" stroke-width="7" stroke-linecap="round" />
    <line x1="-54" y1="-26" x2="54" y2="26" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#94a3b8" stroke-width="3" />
    <circle cx="0" cy="0" r="6" fill="#ff5722" filter="url(#cyanGlow)" />
  </g>

  <!-- Rotor 2: Front-Right (378, 134) -->
  <g transform="translate(378, 134)">
    <circle cx="0" cy="0" r="66" fill="url(#propGlowCyan)" />
    <circle cx="0" cy="0" r="66" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.8" stroke-dasharray="14,10" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.4" />
    <line x1="-26" y1="-54" x2="26" y2="54" stroke="#f1f5f9" stroke-width="7" stroke-linecap="round" />
    <line x1="-26" y1="-54" x2="26" y2="54" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#94a3b8" stroke-width="3" />
    <circle cx="0" cy="0" r="6" fill="#ff5722" filter="url(#cyanGlow)" />
  </g>

  <!-- Rotor 3: Rear-Left (134, 378) -->
  <g transform="translate(134, 378)">
    <circle cx="0" cy="0" r="66" fill="url(#propGlowGreen)" />
    <circle cx="0" cy="0" r="66" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.8" stroke-dasharray="14,10" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4" />
    <line x1="-26" y1="-54" x2="26" y2="54" stroke="#f1f5f9" stroke-width="7" stroke-linecap="round" />
    <line x1="-26" y1="-54" x2="26" y2="54" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#94a3b8" stroke-width="3" />
    <circle cx="0" cy="0" r="6" fill="#10b981" filter="url(#cyanGlow)" />
  </g>

  <!-- Rotor 4: Rear-Right (378, 378) -->
  <g transform="translate(378, 378)">
    <circle cx="0" cy="0" r="66" fill="url(#propGlowGreen)" />
    <circle cx="0" cy="0" r="66" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.8" stroke-dasharray="14,10" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4" />
    <line x1="-54" y1="-26" x2="54" y2="26" stroke="#f1f5f9" stroke-width="7" stroke-linecap="round" />
    <line x1="-54" y1="-26" x2="54" y2="26" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#94a3b8" stroke-width="3" />
    <circle cx="0" cy="0" r="6" fill="#10b981" filter="url(#cyanGlow)" />
  </g>

  <!-- Central Fuselage / Cockpit -->
  <!-- Outer Hull Shadow & Edge -->
  <polygon points="256,180 292,204 312,256 296,306 276,336 236,336 216,306 200,256 220,204"
           fill="#1e293b" stroke="#64748b" stroke-width="4" stroke-linejoin="round" />

  <!-- Inner Carbon Canopy -->
  <polygon points="256,192 284,212 300,256 286,298 256,318 226,298 212,256 228,212"
           fill="#0f172a" stroke="#00e5ff" stroke-width="2.5" stroke-linejoin="round" />

  <!-- FPV Front Gimbal Lens -->
  <circle cx="256" cy="190" r="8" fill="#00f0ff" stroke="#ffffff" stroke-width="2" filter="url(#cyanGlow)" />

  <!-- Glowing Neural Core Reactor (ADAPT-X AI Core) -->
  <circle cx="256" cy="256" r="16" fill="#00f0ff" stroke="#ffffff" stroke-width="3" filter="url(#coreGlow)" />
  <circle cx="256" cy="256" r="8" fill="#ffffff" />

  <!-- ADAPT-X Badge Banner at Bottom -->
  <rect x="176" y="380" width="160" height="34" rx="8" fill="#0f172a" stroke="#00e5ff" stroke-width="2" opacity="0.95" />
  <text x="256" y="403" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#00f0ff" text-anchor="middle" letter-spacing="4">ADAPT-X</text>
</svg>
